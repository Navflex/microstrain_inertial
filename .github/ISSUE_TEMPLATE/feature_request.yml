name: 🚀 Feature request
description: Propose an enhancement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: input
    id: clickup
    attributes:
      label: ClickUp ticket
      description: Link the ClickUp ticket if one exists.
      placeholder: https://app.clickup.com/t/...
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: Why are we here? What are the outcomes?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What should be working for this to be considered done? Functional or non-functional.
